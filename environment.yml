name: bisimulationmol
# Conda environment for the reproducibility package.
# Alternatively use pip:  python -m pip install -r requirements.txt
channels:
  - conda-forge
dependencies:
  - python>=3.10
  - numpy>=1.23
  - pandas>=1.5
  - matplotlib>=3.6
  - networkx>=3.0
  - pydot>=2.0
  - graphviz            # system Graphviz, provides the `dot` binary
  - notebook>=6.5
  - nbconvert>=7.0
  - pip
